name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Run shared format, clippy and doc checks
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@fa264d0e39f0427b66a04fd587c664adad909334 # v1.13.0
        with:
          doc-extra-args: "--all-features"
      - name: Prepare targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add x86_64-unknown-linux-gnu
      - name: Run tests
        run: cargo test --locked --all-targets --workspace --verbose
      - name: Build native crates
        run: cargo build --locked --workspace --verbose
      - name: Build without default features
        run: cargo build --workspace --no-default-features --verbose
      - name: Build wasm target
        run: cargo build --locked --workspace --target wasm32-unknown-unknown --verbose
      - name: Publish dry-run
        uses: csaf-rs/shared-workflows/.github/actions/cargo-publish-dry-run@fa264d0e39f0427b66a04fd587c664adad909334 # v1.13.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Run wasm-pack tests
        run: wasm-pack test --node --features wasm
      - name: Build npm package
        uses: csaf-rs/shared-workflows/.github/actions/wasm-npm-package@fa264d0e39f0427b66a04fd587c664adad909334

  coverage:
    uses: csaf-rs/shared-workflows/.github/workflows/rust-coverage.yml@fa264d0e39f0427b66a04fd587c664adad909334 # v1.13.0
