name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Run shared format, clippy and doc checks
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@4828cd545465d4faade7eb410621ad7d8954f0dc # v1.9.0
        with:
          doc-extra-args: "--all-features"
      - name: Prepare targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add x86_64-unknown-linux-gnu
      - name: Run tests
        run: cargo test --locked --all-targets --workspace --verbose
      - name: Build native crates
        run: cargo build --locked --workspace --verbose
      - name: Build without default features
        run: cargo build --workspace --no-default-features --verbose
      - name: Build wasm target
        run: cargo build --locked --workspace --target wasm32-unknown-unknown --verbose
      - name: Publish dry-run
        uses: csaf-rs/shared-workflows/.github/actions/cargo-publish-dry-run@4828cd545465d4faade7eb410621ad7d8954f0dc # v1.9.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build wasm package and npm dry-run
        run: |
          wasm-pack build --out-dir pkg --scope csaf-rs
          cd pkg
          npm pack --dry-run

  coverage:
    uses: csaf-rs/shared-workflows/.github/workflows/rust-coverage.yml@4828cd545465d4faade7eb410621ad7d8954f0dc # v1.9.0