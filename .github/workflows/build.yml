name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Run shared format, clippy and doc checks
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@8d7fd6241752c334d1c60e80a355722f44d9b99e # v1.2.0
        with:
          doc-extra-args: "--all-features"
      - name: Prepare targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add x86_64-unknown-linux-gnu
      - name: Run tests
        run: cargo test --locked --all-targets --workspace --verbose
      - name: Build native crates
        run: cargo build --locked --workspace --verbose
      - name: Build without default features
        run: cargo build --workspace --no-default-features --verbose
      - name: Build wasm target
        run: cargo build --locked --workspace --target wasm32-unknown-unknown --verbose
      - name: Publish dry-run
        uses: csaf-rs/shared-workflows/.github/actions/cargo-publish-dry-run@56bcf77399696052c9eb925a6059c77c1eaab1bc # v1.6.0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Run wasm-pack tests
        run: wasm-pack test --node --features wasm
      - name: Build wasm package and npm dry-run
        run: |
          wasm-pack build --out-dir pkg --scope csaf-rs --features wasm
          cd pkg
          npm pack --dry-run

  coverage:
    uses: csaf-rs/shared-workflows/.github/workflows/rust-coverage.yml@400ee021e6bdeb7e2808264749e2fe20b25401e8 # v1.3.0
