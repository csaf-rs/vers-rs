[package]
name = "vers-rs"
version = "0.2.0"
repository = "https://github.com/csaf-rs/vers-rs"
keywords = ["vers"]
readme = "README.md"
edition = "2024"
description = "A library for parsing and checking version range specifiers"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:tsify", "dep:serde-wasm-bindgen"]

[dependencies]
thiserror = "2"
pct-str = "3"
semver = { version = "1", features = ["serde"] }
derive_more = { version = "2", features = ["from_str", "display"] }
strum = { version = "0.28.0", features = ["derive"] }
wasm-bindgen = { version = "0.2.104", optional = true }
js-sys = { version = "0.3", optional = true }
tsify = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = "1.0.151"
debversion = { version = "0.5.4", features = ["serde"] }
pep440_rs = "0.7.3"

[dev-dependencies]
rstest = "0.28.0"
wasm-bindgen-test = "0.3"
